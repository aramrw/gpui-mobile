[package]
name = "util"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "A collection of utility structs and functions used by Zed and GPUI"

[lib]
path = "src/util.rs"
doctest = true

[features]
test-support = ["git2", "rand", "util_macros"]

[dependencies]
anyhow = "1"
async_zip = "0.0.17"
collections = { path = "../collections" }
dunce = "1"
futures-lite = "2"
futures = "0.3"
globset = "0.4"
itertools = "0.13"
log = "0.4"
rand = { version = "0.8", optional = true }
regex = "1"
rust-embed = "8"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_lenient = "0.2"
shlex = "1"
take-until = "0.2"
tempfile = "3"
unicase = "2"
url = "2"
percent-encoding = "2"
util_macros = { path = "../util_macros", optional = true }
gpui_util = { path = "../gpui_util" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
smol = "2"
which = "6"
git2 = { version = "0.19", optional = true }
async-fs = "2"
walkdir = "2"
dirs = "5"

[target.'cfg(unix)'.dependencies]
command-fds = "0.3.1"
libc = "0.2"
nix = { version = "0.29", features = ["user"] }

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.4"

[target.'cfg(windows)'.dependencies]
tendril = "0.4.3"

[dev-dependencies]
git2 = "0.19"
rand = "0.8"
# util_macros = { path = "../util_macros" }
pretty_assertions = "1"
