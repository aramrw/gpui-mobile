[package]
name = "gpui_macos"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
path = "src/gpui_macos.rs"

[features]
default = ["gpui/default", "runtime_shaders"]
test-support = ["gpui/test-support"]
runtime_shaders = []
font-kit = ["dep:font-kit"]
screen-capture = ["gpui/screen-capture"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "4dd42a0f77b11d0bed2a072919bcd9180b9a577c", package = "gpui", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
anyhow = "1"
async-task = "4.7"
block = "0.1"
cocoa = "0.26"
collections = { path = "../collections" }
core-foundation = "0.10"
core-foundation-sys = "0.8"
core-graphics = "0.24"
core-text = "21"
core-video = "0.5"
ctor = "0.2"
derive_more = { version = "1.0", features = ["full"] }
dispatch2 = "0.3.1"
etagere = "0.2"
# WARNING: If you change this, you must also publish a new version of zed-font-kit to crates.io
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "110523127440aefb11ce0cf280ae7c5071337ec5", package = "zed-font-kit", version = "0.14.1-zed", optional = true }
foreign-types = "0.5"
futures = "0.3"
image = "0.25"
itertools = "0.13"
libc = "0.2"
log = "0.4"
mach2 = "0.4"
metal = "0.33"
objc = "0.2"
objc2-app-kit = "0.2.2"
parking_lot = "0.12"
pathfinder_geometry = "0.5"
raw-window-handle = "0.6"
semver = "1"
smallvec = "1"
strum = { version = "0.26", features = ["derive"] }
util = { path = "../util" }
uuid = "1"

[target.'cfg(target_os = "macos")'.build-dependencies]
cbindgen = { version = "0.28.0", default-features = false }
gpui = { git = "https://github.com/zed-industries/zed", rev = "4dd42a0f77b11d0bed2a072919bcd9180b9a577c", package = "gpui", default-features = false }
